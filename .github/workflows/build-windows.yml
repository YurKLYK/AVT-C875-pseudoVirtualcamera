name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build
        shell: powershell
        run: .\scripts\build-release.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AVT-C875-Follow-Source-Windows
          path: |
            installer/output/AVT-C875-Follow-Source-Setup.exe
            installer/output/AVT-C875-Follow-Source-manual.zip
            dist/
